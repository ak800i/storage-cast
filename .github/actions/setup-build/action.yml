name: Setup Build Environment
description: Shared setup for Android builds — JDK 17, Gradle, and gradlew permissions

runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      shell: bash
      run: chmod +x gradlew
