name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-pr-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup-build

      - name: Decode keystore
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/keystore.jks

      - name: Generate version code
        id: version
        run: echo "code=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        env:
          KEYSTORE_PATH: ${{ github.event.pull_request.head.repo.full_name == github.repository && format('{0}/app/keystore.jks', github.workspace) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleDebug -PreleaseVersionCode=${{ steps.version.outputs.code }}

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/StorageCast-Debug.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: StorageCast-Debug
          path: app/build/outputs/apk/debug/StorageCast-Debug.apk
